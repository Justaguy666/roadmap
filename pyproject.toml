[project]
name = "roadmap"
version = "0.1.0"
description = "AI-powered adaptive learning and career roadmap agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Domain / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    # Logging
    "structlog>=24.1.0",
    # HTTP
    "httpx>=0.27.0",
    # Caching
    "diskcache>=5.6.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    # LLM (MVP-2, installed now for interface definition)
    "openai>=1.30.0",
    "instructor>=1.3.0",
    # Graph (MVP-4, installed now for interface)
    "networkx>=3.3",
]

[project.scripts]
roadmap = "roadmap.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadmap"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-networkx>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "N806"]
